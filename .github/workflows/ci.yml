name: CI

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck -S warning install.sh uninstall.sh build-installer.sh
      - name: Python syntax
        run: python3 -m py_compile app/netbae.py
      - name: Validate default config
        run: python3 app/netbae.py -c config.toml --check-config
      - name: Smoke test
        run: |
          sed -e 's#/var/lib/netbae/netbae.db#/tmp/netbae-ci.db#' -e 's/^port = 80 .*/port = 8099/' \
              -e 's/^enabled = true/enabled = false/' config.toml > /tmp/ci.toml
          python3 app/netbae.py -c /tmp/ci.toml &
          sleep 12
          curl -fsS localhost:8099/ | grep -q netBae
          curl -fsS localhost:8099/api/summary | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d["ping"]) == 6'
          curl -fsS localhost:8099/api/system | python3 -m json.tool > /dev/null
      - name: Build single-file installer
        run: bash build-installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: netbae-installer
          path: dist/netbae-installer.sh
      - name: Attach installer to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/netbae-installer.sh --clobber
