name: Nix

# NixOS support: builds the flake's package and boots its NixOS VM test (nix/test.nix: the service, the
# dashboard, the netbae command). Runs before a release when flake.nix or nix/ changed (scripts/release.sh
# starts it), or by hand: gh workflow run nix.yml
on:
  workflow_dispatch:
  push:
    branches: [main]   # the public repo, where Actions minutes are free (dev's branch is dev)
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flake:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Let the runner use KVM (for the test VMs)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Show the flake
        run: nix flake show
      - name: Build the package
        run: |
          nix build -L .#netbae
          ./result/bin/netbae version
          ./result/bin/netbae-server -c config.toml --check-config > /dev/null
      - name: NixOS VM test
        run: nix build -L .#checks.x86_64-linux.nixos
