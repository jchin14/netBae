name: Docker

# Runs before each release and publishes after it (scripts/release.sh starts both)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish ghcr.io/jchin14/netbae:<version> and :latest (empty = build and test only)"
        required: false
        default: ""
      ref:
        description: "Commit to build (scripts/release.sh passes the released dev commit; empty = the branch it runs on)"
        required: false
        default: ""
  push:
    branches: [main]   # the public repo, where Actions minutes are free (dev's branch is dev)
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Smoke test (amd64, host networking)
        run: |
          docker build -t netbae:ci .
          docker run -d --name nb --network host -e NETBAE_PORT=8099 -e TZ=Australia/Melbourne netbae:ci
          for i in $(seq 1 40); do curl -fs localhost:8099/api/config >/dev/null && break; sleep 2; done
          curl -fs localhost:8099/api/config | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["docker_bridge"] is False, d; print("version", d["version"])'
          curl -fs localhost:8099/api/summary | python3 -c 'import json,sys; d=json.load(sys.stdin); assert len(d["ping"]) > 30; print(len(d["ping"]), "targets")'
          docker exec nb speedtest --version | head -1
          docker exec nb test -f /data/config.toml
          docker logs nb | tail -5
          docker rm -f nb

      - name: Bridge networking is detected
        run: |
          docker run -d --name nbb -p 8098:80 netbae:ci
          for i in $(seq 1 40); do curl -fs localhost:8098/api/config >/dev/null && break; sleep 2; done
          curl -fs localhost:8098/api/config | python3 -c 'import json,sys; assert json.load(sys.stdin)["docker_bridge"] is True'
          docker rm -f nbb

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: inputs.version != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64, arm64 and arm/v7 (and publish when a version is given)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ inputs.version != '' }}
          tags: |
            ghcr.io/jchin14/netbae:${{ inputs.version || 'ci' }}
            ghcr.io/jchin14/netbae:latest
          labels: |
            org.opencontainers.image.source=https://github.com/jchin14/netBae
            org.opencontainers.image.title=netBae
            org.opencontainers.image.description=Self-hosted internet monitor: ping, DNS, game servers, speedtests, ISP and route tracing
            org.opencontainers.image.version=${{ inputs.version || 'dev' }}
