# ======================================================================================================
#  DON'T EDIT THIS FILE: it's replaced on every update, so any changes here will be lost.
#  Change your hosts in config.toml instead (run `netbae config` to open it), under [ping].
# ======================================================================================================
#
# netBae's built-in hosts: ping targets, DNS servers and domains, and the CDN test's names. Being replaced on
# update is how new defaults arrive by themselves. To change them, use your config.toml:
#   [ping] extra_targets = [ ... ]   your own hosts (one with the same host as a target here replaces it)
#   [ping] disable = [ ... ]         built-in targets to switch off, by name or group, e.g. ["Streaming AU"]
#   [dns]  extra_servers / extra_domains / disable (server names, hosts or domains)
#   [cdn]  extra_hostnames / disable (CDN names or hostnames)
#
# Fields: name, host, group (how the dashboard groups targets), and optionally method = "tcp" with a
# port for hosts that block ping (times a TCP connect instead). host = "gateway" is your router.

targets = [
  { name = "Router",         host = "gateway",          group = "Network" },
  # the first router past yours (usually your ISP's BNG/BRAS), found with a short traceroute, rechecked hourly
  { name = "ISP first hop",  host = "isp:first-hop",    group = "Network" },
  { name = "Cloudflare DNS", host = "1.1.1.1",          group = "DNS" },
  { name = "Google DNS",     host = "8.8.8.8",          group = "DNS" },
  { name = "Quad9",          host = "9.9.9.9",          group = "DNS" },
  { name = "OpenDNS",        host = "208.67.222.222",   group = "DNS" },
  { name = "CleanBrowsing",  host = "185.228.168.9",    group = "DNS" },
  { name = "AdGuard DNS",    host = "94.140.14.14",     group = "DNS" },
  { name = "NextDNS",        host = "45.90.28.0",       group = "DNS" },
  { name = "Control D",      host = "76.76.2.0",        group = "DNS" },
  { name = "Google",         host = "google.com",       group = "Google" },
  { name = "YouTube",        host = "youtube.com",      group = "Google" },
  { name = "Netflix",        host = "www.netflix.com",  group = "Streaming" },   # netflix.com itself blocks ping
  { name = "Twitch",         host = "twitch.tv",        group = "Streaming" },
  { name = "Disney+",        host = "www.disneyplus.com", group = "Streaming" },
  { name = "HBO Max",        host = "www.hbomax.com",   group = "Streaming" },
  { name = "Paramount+",     host = "www.paramountplus.com", group = "Streaming" },   # paramountplus.com itself blocks ping
  # Australian streaming: switch off with disable = ["Streaming AU"] if you're elsewhere
  { name = "Stan",           host = "www.stan.com.au",  group = "Streaming AU" },
  { name = "ABC iview",      host = "iview.abc.net.au", group = "Streaming AU" },
  { name = "7plus",          host = "7plus.com.au",     group = "Streaming AU" },
  { name = "9Now",           host = "www.9now.com.au",  group = "Streaming AU" },
  { name = "SBS On Demand",  host = "www.sbs.com.au",   group = "Streaming AU" },
  { name = "10",             host = "10play.com.au",    group = "Streaming AU" },
  { name = "Foxtel",         host = "www.foxtel.com.au", group = "Streaming AU" },
  { name = "Kayo",           host = "kayosports.com.au", group = "Streaming AU" },
  { name = "Sky News",       host = "www.skynews.com.au", group = "Streaming AU" },
  # Game/voice servers, found automatically (nearest to you, refreshed daily):
  #   valve:auto   = nearest Steam Datagram Relay (Steam, CS2, Dota 2), or a site code like valve:syd, valve:lax
  #   epic:auto    = nearest Fortnite ping beacon, or epic:oce / naw / nac / nae / eu / asia / me / br
  #   discord:auto = nearest Discord voice server, or discord:sydney / singapore / ...
  #   gamelift:auto = nearest AWS GameLift region (UDP ping beacon), where many games host servers,
  #                   or gamelift:ap-southeast-2 / us-west-2 / eu-central-1 / ...
  # Riot (Valorant, LoL) and Activision (Warzone) block ping and connection tests, and Blizzard (Overwatch),
  # EA (Apex) and Ubisoft (Siege) don't publish fixed game server addresses, so those can't be measured.
  { name = "Steam & CS2",    host = "valve:auto",       group = "Gaming" },
  { name = "Fortnite",       host = "epic:auto",        group = "Gaming" },
  { name = "Discord voice",  host = "discord:auto",     group = "Gaming" },
  { name = "AWS GameLift",   host = "gamelift:auto",    group = "Gaming" },
  { name = "Battle.net",     host = "us.actual.battle.net", method = "tcp", port = 1119, group = "Gaming" },   # Blizzard login (Americas and Oceania)
  { name = "Minecraft (Hypixel)", host = "mc.hypixel.net", method = "tcp", port = 25565, group = "Gaming" },
  { name = "Facebook",       host = "facebook.com",     group = "Social" },
  { name = "Reddit",         host = "reddit.com",       group = "Social" },
  { name = "X",              host = "x.com",            group = "Social" },
  { name = "Instagram",      host = "instagram.com",    group = "Social" },
  { name = "TikTok",         host = "www.tiktok.com",   group = "Social" },
  { name = "OpenAI (ChatGPT)", host = "chatgpt.com",    group = "AI" },
  { name = "Anthropic (Claude)", host = "claude.ai",    group = "AI" },
  { name = "Grok",           host = "grok.com",         group = "AI" },
  # Chat and video calls: the apps' own front doors (calls themselves go to media servers near you)
  { name = "Slack",          host = "slack.com",        method = "tcp", port = 443, group = "Calls & chat" },
  { name = "Microsoft Teams", host = "teams.microsoft.com", group = "Calls & chat" },
  { name = "Zoom",           host = "zoom.us",          method = "tcp", port = 443, group = "Calls & chat" },
  { name = "Webex",          host = "www.webex.com",    method = "tcp", port = 443, group = "Calls & chat" },
  { name = "Google Meet",    host = "meet.google.com",  group = "Calls & chat" },
  { name = "Microsoft",      host = "microsoft.com",    group = "Cloud & tech" },
  { name = "Apple",          host = "apple.com",        group = "Cloud & tech" },
  { name = "AWS",            host = "aws.amazon.com",   group = "Cloud & tech" },
  { name = "GitHub",         host = "github.com",       group = "Cloud & tech" },
  { name = "Atlassian",      host = "www.atlassian.com", group = "Cloud & tech" },
  { name = "Akamai",         host = "akamai.com",       group = "CDN" },
  { name = "Fastly",         host = "fastly.com",       group = "CDN" },
  { name = "Cloudflare",     host = "www.cloudflare.com", group = "CDN" },
  { name = "CloudFront",     host = "d1.awsstatic.com", group = "CDN" },   # Amazon's CDN
  { name = "Azure Front Door", host = "www.office.com", group = "CDN" },   # Microsoft's own edge network
  { name = "Bunny",          host = "bunny.net",        group = "CDN" },
  { name = "Gcore",          host = "gcore.com",        group = "CDN" },
  # Chinese clouds and CDNs: their international sites (nearest edge outside mainland China), except Baidu,
  # which is served from China
  { name = "Alibaba Cloud",  host = "www.alibabacloud.com", group = "China cloud & CDN" },
  { name = "Tencent Cloud",  host = "www.tencentcloud.com", group = "China cloud & CDN" },
  { name = "Huawei Cloud",   host = "www.huaweicloud.com",  group = "China cloud & CDN" },
  { name = "Baidu",          host = "www.baidu.com",        group = "China cloud & CDN" },
  { name = "ByteDance (BytePlus)", host = "www.byteplus.com", group = "China cloud & CDN" },
  { name = "CDNetworks (Wangsu)",  host = "www.cdnetworks.com", group = "China cloud & CDN" },
  # Hosting: real data centres, not the providers' websites (those sit behind CDNs). For a region nearer
  # you, add it to extra_targets and disable the one here. Hostnames per provider:
  #   AWS     dynamodb.<region>.amazonaws.com          e.g. us-east-1, eu-west-2, ap-southeast-1
  #   Oracle  objectstorage.<region>.oraclecloud.com   e.g. us-ashburn-1, uk-london-1, ap-singapore-1
  #   Vultr   <code>-ping.vultr.com                    e.g. sgp, lax-ca-us, fra-de, lon-gb
  #   DigitalOcean speedtest-<dc>.digitalocean.com     e.g. nyc1, sfo3, lon1, fra1, ams3
  #   Linode  <region>.linodeobjects.com               e.g. us-east-1, us-southeast-1, eu-central-1, ap-south-1
  #   Hetzner <dc>-speed.hetzner.com                   e.g. nbg1, hel1, ash, hil
  # Linode's speedtest.<city>.linode.com servers stopped answering in October 2026, so its entry is object storage.
  # AWS and Oracle don't answer ping, so they're timed with a TCP connect. Azure has no public per-region
  # host to test, so its entry is the Azure portal on Microsoft's edge network.
  { name = "AWS Sydney",     host = "dynamodb.ap-southeast-2.amazonaws.com", method = "tcp", port = 443, group = "Hosting" },
  { name = "Oracle Cloud Sydney", host = "objectstorage.ap-sydney-1.oraclecloud.com", method = "tcp", port = 443, group = "Hosting" },
  { name = "Azure (portal)", host = "portal.azure.com", group = "Hosting" },
  { name = "OVHcloud Sydney", host = "syd.proof.ovh.net", group = "Hosting" },
  { name = "Vultr Sydney",   host = "syd-au-ping.vultr.com", group = "Hosting" },
  { name = "DigitalOcean Singapore", host = "sgp1.digitaloceanspaces.com", group = "Hosting" },
  { name = "Linode Singapore", host = "ap-south-1.linodeobjects.com", group = "Hosting" },
  { name = "Hetzner Falkenstein", host = "fsn1-speed.hetzner.com", group = "Hosting" },
  # Usenet providers. Omicron (formerly Highwinds) also runs UsenetServer, Easynews and Newsgroup Ninja;
  # NewsDemon resells UsenetExpress; Tweaknews and Pure Usenet share Eweka's network.
  { name = "Omicron (Newshosting)", host = "news.newshosting.com", group = "Usenet US" },
  { name = "Easynews",       host = "news.easynews.com",       group = "Usenet US" },   # Phoenix
  { name = "Giganews",       host = "news.giganews.com",       group = "Usenet US" },
  { name = "UsenetExpress",  host = "news.usenetexpress.com", group = "Usenet US" },
  { name = "Frugal Usenet",  host = "news.frugalusenet.com",   group = "Usenet US" },
  { name = "Eweka",          host = "news.eweka.nl",           group = "Usenet EU" },   # Amsterdam
  { name = "Usenet.Farm",    host = "news.usenet.farm",        group = "Usenet EU" },   # Netherlands
]

# DNS servers: every one is asked for every domain on each run. IPv6 servers are only queried when this
# machine has IPv6 internet. host = "gateway" is your router, over IPv4 and (when it answers DNS there) IPv6;
# host = "dhcp" is the IPv4 and IPv6 DNS servers this machine was given by DHCP or router adverts, if they're
# not the router (e.g. your ISP's resolvers or a Pi-hole). The router's own IPv6 address counts as the router.
# A name with one IPv4 and one IPv6 address also pairs them for the ping charts' IPv6 lines.
dns_servers = [
  { name = "Router",        host = "gateway" },
  { name = "DHCP DNS",      host = "dhcp" },
  { name = "Cloudflare",    host = "1.1.1.1" },
  { name = "Cloudflare",    host = "2606:4700:4700::1111" },
  { name = "Google",        host = "8.8.8.8" },
  { name = "Google",        host = "2001:4860:4860::8888" },
  { name = "Quad9",         host = "9.9.9.9" },
  { name = "Quad9",         host = "2620:fe::fe" },
  { name = "Quad9 ECS",     host = "9.9.9.11" },      # with EDNS Client Subnet: CDNs see roughly where you are
  { name = "Quad9 ECS",     host = "2620:fe::11" },
  { name = "OpenDNS",       host = "208.67.222.222" },
  { name = "OpenDNS",       host = "2620:119:35::35" },
  { name = "CleanBrowsing", host = "185.228.168.9" },        # security filter
  { name = "CleanBrowsing", host = "2a0d:2a00:1::2" },
  { name = "AdGuard",       host = "94.140.14.14" },
  { name = "AdGuard",       host = "2a10:50c0::ad1:ff" },
  { name = "NextDNS",       host = "45.90.28.0" },           # no account needed; add your profile's IPs to test your own
  { name = "NextDNS",       host = "2a07:a8c0::" },
  { name = "Control D",     host = "76.76.2.0" },
  { name = "Control D",     host = "2606:1a40::" },
]
dns_domains = ["google.com", "microsoft.com", "facebook.com", "reddit.com", "netflix.com"]

# The DNS and CDN test: every DNS server looks up these names and the addresses it hands out are pinged.
# CDNs pick a server near the resolver that asks, so this shows which resolver sends you somewhere close.
# name = the CDN: names that share one get one column on the dashboard.
# (Cloudflare uses the same anycast addresses everywhere, so it's a baseline: your ISP's routing, not the
# resolver, decides which Cloudflare site answers)
cdn = [
  { name = "Akamai",     host = "a2.w10.akamai.net" },
  { name = "Akamai",     host = "a10.w2.akamai.net" },
  { name = "Google",     host = "google.com" },
  { name = "Microsoft",  host = "microsoft.com" },
  { name = "Cloudflare", host = "www.cloudflare.com" },
  { name = "Amazon",     host = "d1.awsstatic.com" },     # CloudFront
  { name = "Fastly",     host = "www.fastly.com" },
  { name = "Meta",       host = "static.xx.fbcdn.net" },
]
