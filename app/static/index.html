<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>netBae</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2.5' stroke-linecap='round'%3E%3Cpolyline points='2 12 6 12 9 4 15 20 18 12 22 12'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>netBae <span id="hostname" class="muted"></span></h1>
      <div id="subtitle" class="muted small"></div>
    </div>
    <div class="top-right small">
      <span id="live-dot" class="dot"></span>
      <span id="updated" class="muted">connecting…</span>
    </div>
  </header>

  <main>
    <section id="ping-tiles" class="tiles"></section>

    <section class="grid2">
      <div class="card" id="speed-card">
        <div class="card-head">
          <h2>Latest speedtest</h2>
          <button id="run-speedtest" class="btn">Run now</button>
        </div>
        <div id="speed-summary" class="speed-summary"><span class="muted">No results yet</span></div>
        <div id="speed-meta" class="muted small"></div>
      </div>
      <div class="card" id="system-card">
        <div class="card-head"><h2>System</h2><span id="sys-model" class="muted small"></span></div>
        <div id="sys-body" class="sys-body"></div>
      </div>
    </section>

    <section class="card panel" id="panel-ping">
      <div class="panel-head">
        <h2>Ping latency</h2>
        <div class="controls">
          <select class="metric" aria-label="Metric">
            <option value="avg">Average</option>
            <option value="max">Maximum</option>
            <option value="loss">Packet loss %</option>
          </select>
          <span class="range"></span>
        </div>
      </div>
      <div class="chips"></div>
      <div class="chart-wrap"><canvas></canvas></div>
      <div class="table-wrap"><table class="stats"></table></div>
    </section>

    <section class="card panel" id="panel-dns">
      <div class="panel-head">
        <h2>DNS response time</h2>
        <div class="controls">
          <select class="domain" aria-label="Domain"><option value="">All domains</option></select>
          <select class="metric" aria-label="Metric">
            <option value="avg">Average</option>
            <option value="max">Maximum</option>
            <option value="loss">Failures %</option>
          </select>
          <span class="range"></span>
        </div>
      </div>
      <div class="chips"></div>
      <div class="chart-wrap"><canvas></canvas></div>
      <div class="table-wrap"><table class="stats"></table></div>
    </section>

    <section class="card panel" id="panel-speed">
      <div class="panel-head">
        <h2>Speedtest history</h2>
        <div class="controls">
          <select class="server" aria-label="Server"><option value="">All servers</option></select>
          <span class="range"></span>
        </div>
      </div>
      <div class="chips"></div>
      <div class="chart-wrap"><canvas></canvas></div>
      <div class="table-wrap"><table class="stats"></table></div>
    </section>

    <section class="card panel" id="panel-system">
      <div class="panel-head">
        <h2>System history</h2>
        <div class="controls"><span class="range"></span></div>
      </div>
      <div class="chips"></div>
      <div class="chart-wrap"><canvas></canvas></div>
    </section>

    <footer class="muted small" id="footer"></footer>
  </main>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="vendor/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
