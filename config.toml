# netBae configuration
# Location after install: /etc/netbae/config.toml
# Apply changes with:     sudo systemctl restart netbae
# Validate with:          sudo -u netbae python3 /opt/netbae/netbae.py --check-config
#
# Scheduling: every collector runs on wall-clock boundaries (local time).
# The offset shifts the boundary, e.g. interval_minutes = 60 + offset_minutes = 6
# runs at 00:06, 01:06, 02:06 ...; interval_minutes = 30 + offset_minutes = 6
# runs at :06 and :36.

[web]
host = "0.0.0.0"       # 0.0.0.0 = reachable from other machines on your network
port = 80             # dashboard at http://<this-machine>/ ; if it's taken, the next free port is used
update_check = true   # check GitHub for new releases (every 6 hours) and show an Update button on the dashboard
auto_update = "weekly"  # install new releases automatically at 3:30 am: "weekly" (at most once a week), "daily" or "off"
chart_band = "none"   # spread band on the latency charts by default: "none", "p5-p95" or "min-max"
                      # (each browser remembers its own choice; drawn with 12 or fewer lines)

# Read-only copy of the dashboard on a second port, for sharing (best through a Cloudflare
# Tunnel or Tailscale Funnel - see the README; don't port-forward it on your router).
# It runs alongside the main dashboard in the same service. Visitors can look but can't
# run speedtests or anything else, and requests are rate-limited. Your public IPv4 addresses
# show as 203.0.x.x, IPv6 addresses in any /48 you've had as 2403:5800:x:x:x:x:x:x, and
# hostnames carrying your addresses, names on your own domain (found from your router, this
# machine and your DNS search domain), names of hops inside your network and this machine's
# name are hidden.
[public]
enabled = false
host = "0.0.0.0"                  # "127.0.0.1" if the tunnel runs on this machine (hides it from your LAN), "::" for IPv6 too
port = 8080
requests_per_minute = 120         # per visitor; an open dashboard uses about 20 a minute
total_requests_per_minute = 1200  # all visitors together
hide = []                         # anything else to hide: addresses, prefixes or domains,
                                  # e.g. ["198.51.100.0/24", "2001:db8:1234::/48", "example.com"]
show_hostname = false             # true = show this machine's name (often includes yours, e.g. Sams-Pi)
show_city = true                  # false = only the country of your ISP location, and no first city on routes

[storage]
database = "/var/lib/netbae/netbae.db"
# Data is kept at three resolutions. 0 = keep forever.
raw_retention_days = 7       # full-resolution samples (every ping)
minute_retention_days = 90   # 1-minute summaries (count, avg, min, max, latency histogram)
retention_days = 0           # hourly summaries, speedtests and system history

[ping]
interval_seconds = 30
offset_seconds = 0     # e.g. 2 -> pings at :02, :32, 1:02 ...
timeout_seconds = 2
# Ping targets: netBae's built-in list (74 hosts: DNS, streaming, gaming, social, AI, calls, cloud, CDNs, hosting,
# Usenet ...) is in targets.toml next to netbae.py (/opt/netbae on Linux and in Docker, /usr/local/lib/netbae on macOS,
# C:\Program Files\netBae on Windows) and is updated with netBae, so new defaults arrive by themselves.
# Change it here:
#   extra_targets  your own hosts. One with the same host as a built-in target replaces it (e.g. to rename it).
#                  method = "icmp" (default, normal ping) or "tcp" (times a TCP connect, for hosts that
#                  block ping) with a port; host = "gateway" is your router; group = any name you like.
#   disable        built-in targets to switch off, by name or group
# Or set targets = [ ... ] to use only your own list (the built-in list is then ignored).
extra_targets = [
  # { name = "My server", host = "example.com", group = "Mine" },
  # { name = "Amazon",    host = "amazon.com", method = "tcp", port = 443, group = "Shopping" },   # blocks ping
]
disable = []           # e.g. ["Streaming AU", "China cloud & CDN", "Hetzner Falkenstein"]

# Region pings: latency to the fastest Ookla speedtest server in each city (TCP connect to
# the server, found automatically and refreshed daily). Same names as [speedtest] regions.
regions = ["Sydney", "Perth", "Auckland", "Singapore", "Hong Kong", "Tokyo", "Guam", "Delhi", "Oman",
           "Los Angeles", "Toronto", "New York", "São Paulo", "London", "Amsterdam", "Paris", "Milan",
           "Cape Town"]
region_interval_seconds = 60
# Also ping each site over IPv6, as a separate line, when this machine and the site have IPv6.
# IPv4 sites keep their IPv4 history; the dashboard's tiles show both and the chart can switch
# between IPv4, IPv6 or both. Regions use an IPv6-capable speedtest server in the same city.
# (Not the router, game servers or secondary connections.)
ipv6 = true

[dns]
enabled = true
interval_seconds = 30
offset_seconds = 0
timeout_seconds = 2
# Every server is asked for every domain on each run. IPv6 servers are only queried when
# this machine has IPv6 internet (checked every 10 minutes).
#   host = "gateway" - your router
#   host = "dhcp"    - the DNS servers this machine was given by DHCP, if they're not the router
#                      (e.g. your ISP's resolvers, or the router's IPv6 address)
servers = [
  { name = "Router",        host = "gateway" },
  { name = "DHCP DNS",      host = "dhcp" },
  { name = "Cloudflare",    host = "1.1.1.1" },
  { name = "Cloudflare",    host = "2606:4700:4700::1111" },
  { name = "Google",        host = "8.8.8.8" },
  { name = "Google",        host = "2001:4860:4860::8888" },
  { name = "Quad9",         host = "9.9.9.9" },
  { name = "Quad9",         host = "2620:fe::fe" },
  { name = "Quad9 ECS",     host = "9.9.9.11" },      # with EDNS Client Subnet: CDNs see roughly where you are
  { name = "Quad9 ECS",     host = "2620:fe::11" },
  { name = "OpenDNS",       host = "208.67.222.222" },
  { name = "OpenDNS",       host = "2620:119:35::35" },
  { name = "CleanBrowsing", host = "185.228.168.9" },        # security filter
  { name = "CleanBrowsing", host = "2a0d:2a00:1::2" },
  { name = "AdGuard",       host = "94.140.14.14" },
  { name = "AdGuard",       host = "2a10:50c0::ad1:ff" },
  { name = "NextDNS",       host = "45.90.28.0" },           # no account needed; add your profile's IPs to test your own
  { name = "NextDNS",       host = "2a07:a8c0::" },
  { name = "Control D",     host = "76.76.2.0" },
  { name = "Control D",     host = "2606:1a40::" },
]
domains = ["google.com", "microsoft.com", "facebook.com", "reddit.com", "netflix.com"]

[cdn]
# Which CDN server each DNS resolver sends you to. CDNs pick a server near the resolver that asks,
# so every [dns] server looks up these names, the addresses it hands out are pinged (and traced
# every few hours), and the dashboard ranks the resolvers by the average latency to them.
enabled = true
# (Cloudflare uses the same anycast addresses everywhere, so it's a baseline: your ISP's routing, not the
# resolver, decides which Cloudflare site answers)
hostnames = ["a2.w10.akamai.net", "a10.w2.akamai.net", "google.com", "microsoft.com", "www.cloudflare.com"]
interval_minutes = 30
offset_minutes = 20
pings = 5              # pings per address each run
trace_hours = 6        # trace each address at most this often (0 = don't trace)

[speedtest]
enabled = true         # scheduled speedtests (main, regions and secondary connections)
manual = true          # the dashboard's Run buttons; works even when enabled = false
interval_minutes = 60
offset_minutes = 0     # e.g. 6 -> runs at hh:06 instead of hh:00
# Empty = Ookla picks the best server automatically.
# Otherwise list server IDs (find them with: speedtest -L); each listed server
# is tested in turn on every run, e.g. servers = [12492, 2629]
servers = []

# Region speedtests: test against servers in other cities on their own (slower) schedule.
# Built-in: London, New York, Tokyo, Amsterdam, Singapore, Sydney, Auckland, Los Angeles,
# Hong Kong, Milan, Paris, Oman, Delhi, Guam, Perth, São Paulo, Cape Town, Toronto.
# (Ookla has no public servers in mainland China, so Beijing isn't available.)
# Custom: { name = "Frankfurt", city = "Frankfurt", country = "Germany" } or { name = "Work", server_id = 12345 }
# Each test uses ~0.5-1 GB on a fast connection, so keep the interval long or the list short.
regions = []           # e.g. ["Sydney", "Singapore", "Los Angeles", "London"]
regions_interval_minutes = 1440   # once a day
regions_offset_minutes = 30       # e.g. 00:30 - with 1440, the offset is the time of day
# Global speedtests: after every N successful main tests (scheduled or Run now), one more to a random server
# in a random city around the world (~45 cities). Shown in their own section and not counted in your averages.
# Each uses about as much data as a normal test. 0 = off.
global_every = 5
# Busy check: before a scheduled test, measure other traffic for 5 seconds (the router's own counters
# over UPnP if it offers them, which see every device; otherwise only this machine's traffic).
# Above busy_percent of the last result, wait and check again every 3 minutes; after busy_wait_minutes
# test anyway and mark the result "busy". Run now buttons never wait.
busy_check = true
busy_percent = 10
busy_wait_minutes = 30
binary = "auto"       # auto = official Ookla CLI in /usr/bin, /usr/local/bin or /opt/homebrew/bin
timeout_seconds = 300

[isp]
# Checks the public IP and ISP of the main connection and every secondary connection
# (via ipinfo.io), shown in the header and as markers along the top of the charts, so you
# can see when your router failed over to another connection.
enabled = true
interval_minutes = 10
offset_minutes = 0
main_name = "Main"     # what to call your main connection

[traceroute]
# Traces the route to every ping target (and the speedtest server) and looks up which network
# owns each hop, so the dashboard can show whether traffic is on-net, peers directly with the
# destination, or goes via transit providers like Cogent, Arelion or GTT.
enabled = true
interval_hours = 12
offset_minutes = 15
max_hops = 25
parallel = 6           # traces at once
ipv6 = true            # also trace IPv6 routes to the sites pinged over IPv6 ([ping] ipv6)

[system]
interval_seconds = 30
offset_seconds = 0
disk_path = "/"        # the drive shown as Boot drive ("/" = the one the system runs from); the dashboard
                       # also adds up every local drive when there's more than one

# --------------------------------------------------------------------------------------------
# Secondary internet connections (e.g. a 5G/4G link next to your main one). netBae sends their
# tests from a different source IP or network interface, and your router sends that traffic
# out of the other WAN. See "Monitoring a secondary connection" in the README.
#
# [[connections]]
# name = "Secondary"
# bind = "192.168.1.51"         # a second IP on this machine (router policy-routes it to the secondary WAN),
#                               # or an interface plugged into the secondary modem, e.g. "eth1" / "wlan0"
# targets = ["1.1.1.1", "8.8.8.8", "google.com", "valve:auto"]   # or "all" to ping every main target over it too
# speedtest = true
# speedtest_interval_minutes = 1440   # once a day (mobile data isn't free). 0 = manual only
# speedtest_offset_minutes = 45
